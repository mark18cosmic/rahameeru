# Local stack: the app plus a Firebase Emulator Suite standing in for the real
# project. Nothing here talks to production Firebase — the config values are
# placeholders the emulator ignores.
#
#   docker compose -f docker-compose.dev.yml up --build
#   npm run seed                     # once the emulator is listening
#
# App        http://localhost:3200
# Emulator UI http://localhost:4000
services:
  emulator:
    build:
      context: .
      dockerfile: docker/firebase-emulator.Dockerfile
    image: rahameeru-emulator:latest
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      args:
        # Placeholders: the emulator accepts any project, and the SDK only needs
        # these to be non-empty before it will initialise.
        NEXT_PUBLIC_FIREBASE_API_KEY: emulator-key
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: rahameeru-local.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: rahameeru-local
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: rahameeru-local.appspot.com
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:local"
        # Baked into the client bundle: the browser reaches the emulator through
        # the published ports on the host, not through the compose network.
        NEXT_PUBLIC_FIREBASE_EMULATOR_HOST: localhost
        # Accounts allowed into /admin. Comma separated.
        NEXT_PUBLIC_ADMIN_EMAILS: ${NEXT_PUBLIC_ADMIN_EMAILS:-}
    image: rahameeru:dev
    ports:
      # 3000 is a busy port on most dev machines; the stack claims 3200 instead.
      - "3200:3000"
    environment:
      NODE_ENV: production
      # Server-side rendering runs inside the network, where the emulator is a
      # service name rather than localhost.
      FIREBASE_EMULATOR_HOST: emulator
    depends_on:
      emulator:
        condition: service_healthy
    restart: unless-stopped
